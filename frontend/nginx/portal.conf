# Portal, API e WebSocket: só em HTTPS (no HTTP, redireciona).

# O nginx é a borda: sobrescreve X-Forwarded-For/X-Real-IP com o IP real da conexão, senão o cliente
# poderia forjar o IP gravado no log de login e na auditoria. Atrás de outro proxy, use o módulo realip.
location /admin-api/ {
    proxy_pass http://backend:48080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # o assistente de IA pode levar mais de um minuto (várias consultas e o modelo)
    proxy_read_timeout 300s;
}

# Envio do arquivo do pacote: grande e em fluxo (sem guardar em buffer no nginx)
location = /admin-api/inventario/pacote/arquivo {
    client_max_body_size 2g;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_pass http://backend:48080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# importação do banco do Uptime Kuma (kuma.db pode passar de 1 GB)
location = /admin-api/monitoramento/importar/kuma {
    client_max_body_size 2g;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_pass http://backend:48080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /infra/ws {
    proxy_pass http://backend:48080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 3600s;
}

# PWA: o navegador precisa sempre conferir estes dois, senão uma versão nova do portal demora a chegar.
# add_header aqui substitui os do servidor, por isso o nosniff é repetido.
location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}

location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}

# Sem isto o navegador reaproveita o index.html do próprio cache: sem rede, abre o portal cheio de erros em vez da
# página offline, e depois de uma atualização pode continuar na versão antiga.
location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

location / {
    try_files $uri $uri/ /index.html;
}
