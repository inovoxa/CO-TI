# Mesmo domínio para o portal, a API e o WebSocket: sem CORS e com cookies/tokens só na origem do portal
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;

    # O nginx é a borda: sobrescreve X-Forwarded-For/X-Real-IP com o IP real da conexão, senão o cliente
    # poderia forjar o IP gravado no log de login e na auditoria. Atrás de outro proxy, use o módulo realip.
    location /admin-api/ {
        proxy_pass http://backend:48080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # o assistente de IA pode levar mais de um minuto (várias consultas e o modelo)
        proxy_read_timeout 300s;
    }

    # Agentes de inventário: OCS (/ocsinventory) e GLPI Agent (/front/inventory.php, o mesmo caminho do GLPI)
    location ~ ^/(ocsinventory|front/inventory\.php)/?$ {
        rewrite ^ /admin-api/inventario/agente break;
        proxy_pass http://backend:48080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Pacotes para os agentes OCS (arquivo info e fragmentos)
    location /download/ {
        rewrite ^/download/(.*)$ /admin-api/inventario/download/$1 break;
        proxy_pass http://backend:48080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Envio do arquivo do pacote: grande e em fluxo (sem guardar em buffer no nginx)
    location = /admin-api/inventario/pacote/arquivo {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_pass http://backend:48080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # push do monitoramento, na mesma URL do Uptime Kuma (scripts e cron existentes continuam funcionando)
    location /api/push/ {
        rewrite ^/api/push/(.*)$ /admin-api/monitoramento/push/$1 break;
        proxy_pass http://backend:48080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # importação do banco do Uptime Kuma (kuma.db pode passar de 1 GB)
    location = /admin-api/monitoramento/importar/kuma {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_pass http://backend:48080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /infra/ws {
        proxy_pass http://backend:48080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
