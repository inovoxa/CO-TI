server:
  port: ${SERVER_PORT:48080}

--- #################### 数据库相关配置 ####################
spring:
  autoconfigure:
    # noinspection SpringBootApplicationYaml
    exclude:
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration # 默认 local 环境，不开启 Quartz 的自动配置
      - org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration # 禁用 AI 模块的 Qdrant，手动创建
      - org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration # 禁用 AI 模块的 Milvus，手动创建
  # 数据源配置项
  datasource:
    druid: # Druid 【监控】相关的全局配置
      web-stat-filter:
        enabled: false
      stat-view-servlet:
        enabled: false # CO-TI: painel /druid desligado (expunha SQL e sessões sem senha)
        allow: # 设置白名单，不填则允许所有访问
        url-pattern: /druid/*
        login-username: # 控制台管理用户名和密码
        login-password:
      filter:
        stat:
          enabled: true
          log-slow-sql: true # 慢 SQL 记录
          slow-sql-millis: 100
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
    dynamic: # 多数据源配置
      druid: # Druid 【连接池】相关的全局配置
        initial-size: 1 # 初始连接数
        min-idle: 1 # 最小连接池数量
        max-active: 20 # 最大连接池数量
        max-wait: 60000 # 配置获取连接等待超时的时间，单位：毫秒（1 分钟）
        time-between-eviction-runs-millis: 60000 # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位：毫秒（1 分钟）
        min-evictable-idle-time-millis: 600000 # 配置一个连接在池中最小生存的时间，单位：毫秒（10 分钟）
        max-evictable-idle-time-millis: 1800000 # 配置一个连接在池中最大生存的时间，单位：毫秒（30 分钟）
        validation-query: SELECT 1 # 配置检测连接是否有效
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: false # CO-TI: o PSCache do Druid fecha statements do driver PostgreSQL ("Este comando foi fechado") # 是否开启 PreparedStatement 缓存
        max-pool-prepared-statement-per-connection-size: 0 # CO-TI: >0 religa o PSCache no Druid
      primary: master
      datasource:
        master:
          url: ${CO_TI_DB_URL:jdbc:postgresql://127.0.0.1:5432/coti}
          username: ${CO_TI_DB_USER:coti}
          password: ${CO_TI_DB_PASSWORD}
#        tdengine: # IoT 数据库（需要 IoT 物联网，且 yudao.iot.storage.type 为 tdengine 再开启噢！）
#          lazy: true # 开启懒加载，保证启动速度
#          url: jdbc:TAOS-WS://127.0.0.1:6041/ruoyi_vue_pro?varcharAsString=true&enableAutoReconnect=true # 参见：https://t.zsxq.com/qaX9c，开启 TDengine WebSocket 自动重连
#          driver-class-name: com.taosdata.jdbc.ws.WebSocketDriver
#          username: root
#          password: taosdata
#          druid:
#            validation-query: SELECT SERVER_STATUS() # TDengine 数据源的有效性检查 SQL
#        iotdb: # IoT 数据库（需要 IoT 物联网，且 yudao.iot.storage.type 为 iotdb 再开启噢！）
#          lazy: true # 开启懒加载，保证启动速度
#          type: com.zaxxer.hikari.HikariDataSource # IoTDB 不使用 Druid 连接池
#          url: jdbc:iotdb://127.0.0.1:6667/ruoyi_vue_pro?sql_dialect=table # 表模型；数据库需要预先创建，且时间精度为 ms
#          driver-class-name: org.apache.iotdb.jdbc.IoTDBDriver
#          username: root
#          password: root
#          hikari:
#            maximum-pool-size: 8
#            connection-test-query: SELECT 1 # IoTDB 数据源的有效性检查 SQL

  # Redis 配置。Redisson 默认的配置足够使用，一般不需要进行调优
  data:
    redis:
      host: ${CO_TI_REDIS_HOST:127.0.0.1}
      port: ${CO_TI_REDIS_PORT:6379}
      database: 0
      password: ${CO_TI_REDIS_PASSWORD:}
#      password: dev # 密码，建议生产环境开启

--- #################### 定时任务相关配置 ####################

# Quartz 配置项，对应 QuartzProperties 配置类
spring:
  quartz:
    auto-startup: true # 本地开发环境，尽量不要开启 Job
    scheduler-name: schedulerName # Scheduler 名字。默认为 schedulerName
    job-store-type: jdbc # Job 存储器类型。默认为 memory 表示内存，可选 jdbc 使用数据库。
    wait-for-jobs-to-complete-on-shutdown: true # 应用关闭时，是否等待定时任务执行完成。默认为 false ，建议设置为 true
    properties: # 添加 Quartz Scheduler 附加属性，更多可以看 http://www.quartz-scheduler.org/documentation/2.4.0-SNAPSHOT/configuration.html 文档
      org:
        quartz:
          # Scheduler 相关配置
          scheduler:
            instanceName: schedulerName
            instanceId: AUTO # 自动生成 instance ID
          # JobStore 相关配置
          jobStore:
            # JobStore 实现类。可见博客：https://blog.csdn.net/weixin_42458219/article/details/122247162
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            isClustered: true # 是集群模式
            clusterCheckinInterval: 15000 # 集群检查频率，单位：毫秒。默认为 15000，即 15 秒
            misfireThreshold: 60000 # misfire 阀值，单位：毫秒。
          # 线程池相关配置
          threadPool:
            threadCount: 25 # 线程池大小。默认为 10 。
            threadPriority: 5 # 线程优先级
            class: org.quartz.simpl.SimpleThreadPool # 线程池类型
    jdbc: # 使用 JDBC 的 JobStore 的时候，JDBC 的配置
      initialize-schema: NEVER # 是否自动使用 SQL 初始化 Quartz 表结构。这里设置成 never ，我们手动创建表结构。

--- #################### 消息队列相关 ####################

# rocketmq 配置项，对应 RocketMQProperties 配置类
rocketmq:
  name-server: 127.0.0.1:9876 # RocketMQ Namesrv

spring:
  # RabbitMQ 配置项，对应 RabbitProperties 配置类
  rabbitmq:
    host: 127.0.0.1 # RabbitMQ 服务的地址
    port: 5672 # RabbitMQ 服务的端口
    username: rabbit # RabbitMQ 服务的账号
    password: rabbit # RabbitMQ 服务的密码
  # Kafka 配置项，对应 KafkaProperties 配置类
  kafka:
    bootstrap-servers: 127.0.0.1:9092 # 指定 Kafka Broker 地址，可以设置多个，以逗号分隔

--- #################### 服务保障相关配置 ####################

# Lock4j 配置项
lock4j:
  acquire-timeout: 3000 # 获取分布式锁超时时间，默认为 3000 毫秒
  expire: 30000 # 分布式锁的超时时间，默认为 30000 毫秒

--- #################### 监控相关配置 ####################

# Actuator 监控端点的配置项
management:
  endpoints:
    web:
      base-path: /actuator # Actuator 提供的 API 接口的根目录。默认为 /actuator
      exposure:
        include: health,info # CO-TI: só o necessário para o healthcheck do Docker

# Spring Boot Admin 配置项
spring:
  boot:
    admin:
      # Spring Boot Admin Client 客户端的相关配置
      client:
        url: http://127.0.0.1:${server.port}/${spring.boot.admin.context-path} # 设置 Spring Boot Admin Server 地址
        instance:
          service-host-type: IP # 注册实例时，优先使用 IP [IP, HOST_NAME, CANONICAL_HOST_NAME]
        username: ${CO_TI_ADMIN_MONITOR_USER:monitor}
        password: ${CO_TI_ADMIN_MONITOR_PASSWORD}
      # Spring Boot Admin Server 服务端的相关配置
      context-path: /admin # 配置 Spring
      # 允许嵌入 iframe 的域名（支持通配符），实际部署时，可以改为 "'self' [你的公网域名]"
      frame-ancestors: "'self' localhost localhost:48080 127.0.0.1 127.0.0.1:48080"

# 日志文件配置
logging:
  file:
    name: ${CO_TI_LOG_DIR:${user.home}/logs}/${spring.application.name}.log # 日志文件名，全路径
  level:
    # 配置自己写的 MyBatis Mapper 打印日志
    cn.iocoder.yudao.module.bpm.dal.mysql: debug
    cn.iocoder.yudao.module.infra.dal.mysql: debug
    cn.iocoder.yudao.module.infra.dal.mysql.logger.ApiErrorLogMapper: INFO # 配置 ApiErrorLogMapper 的日志级别为 info，避免和 GlobalExceptionHandler 重复打印
    cn.iocoder.yudao.module.infra.dal.mysql.job.JobLogMapper: INFO # 配置 JobLogMapper 的日志级别为 info
    cn.iocoder.yudao.module.infra.dal.mysql.file.FileConfigMapper: INFO # 配置 FileConfigMapper 的日志级别为 info
    cn.iocoder.yudao.module.pay.dal.mysql: debug
    cn.iocoder.yudao.module.pay.dal.mysql.notify.PayNotifyTaskMapper: INFO # 配置 PayNotifyTaskMapper 的日志级别为 info
    cn.iocoder.yudao.module.system.dal.mysql: debug
    cn.iocoder.yudao.module.system.dal.mysql.sms.SmsChannelMapper: INFO # 配置 SmsChannelMapper 的日志级别为 info
    cn.iocoder.yudao.module.tool.dal.mysql: debug
    cn.iocoder.yudao.module.member.dal.mysql: debug
    cn.iocoder.yudao.module.trade.dal.mysql: debug
    cn.iocoder.yudao.module.promotion.dal.mysql: debug
    cn.iocoder.yudao.module.statistics.dal.mysql: debug
    cn.iocoder.yudao.module.crm.dal.mysql: debug
    cn.iocoder.yudao.module.erp.dal.mysql: debug
    cn.iocoder.yudao.module.mes.dal.mysql: debug
    cn.iocoder.yudao.module.wms.dal.mysql: debug
    cn.iocoder.yudao.module.iot.dal.mysql: debug
    cn.iocoder.yudao.module.iot.dal.tdengine: DEBUG
    cn.iocoder.yudao.module.iot.service.rule: debug
    cn.iocoder.yudao.module.ai.dal.mysql: debug
    cn.iocoder.yudao.module.im.dal.mysql: debug
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR # TODO 芋艿：先禁用，Spring Boot 3.X 存在部分错误的 WARN 提示

debug: false

--- #################### 微信公众号、小程序相关配置 ####################
wx:
  mp: # 公众号配置（必填），参见 https://github.com/Wechat-Group/WxJava/blob/develop/spring-boot-starters/wx-java-mp-spring-boot-starter/README.md 文档
#    app-id: wx041349c6f39b268b # 测试号（牛希尧提供的）
#    secret: 5abee519483bc9f8cb37ce280e814bd0
#    app-id: wx5b23ba7a5589ecbb # 测试号（自己的）
#    secret: 2a7b3b20c537e52e74afd395eb85f61f
    app-id: ${CO_TI_WX_APPID:desativado}
    secret: ${CO_TI_WX_SECRET:desativado}
    # 存储配置，解决 AccessToken 的跨节点的共享
    config-storage:
      type: RedisTemplate # 采用 RedisTemplate 操作 Redis，会自动从 Spring 中获取
      key-prefix: wx # Redis Key 的前缀
      http-client-type: HttpComponents # 采用 HttpComponents（HttpClient 5）请求微信公众号平台
  miniapp: # 小程序配置（必填），参见 https://github.com/Wechat-Group/WxJava/blob/develop/spring-boot-starters/wx-java-miniapp-spring-boot-starter/README.md 文档
    #    appid: wx62056c0d5e8db250 # 测试号（牛希尧提供的）
    #    secret: 333ae72f41552af1e998fe1f54e1584a
#    appid: wx63c280fe3248a3e7 # wenhualian的接口测试号
#    secret: 6f270509224a7ae1296bbf1c8cb97aed
    appid: ${CO_TI_WXA_APPID:desativado}
    secret: ${CO_TI_WXA_SECRET:desativado}
#    appid: wx66186af0759f47c9 # 测试号（puhui 提供的）
#    secret: 3218bcbd112cbc614c7264ceb20144ac
    config-storage:
      type: RedisTemplate # 采用 RedisTemplate 操作 Redis，会自动从 Spring 中获取
      key-prefix: wa # Redis Key 的前缀
      http-client-type: HttpComponents # 采用 HttpComponents（HttpClient 5）请求微信小程序平台

--- #################### 芋道相关配置 ####################

# 芋道配置项，设置当前项目所有自定义的配置
yudao:
  captcha:
    enable: ${CO_TI_CAPTCHA:true}
  security:
    mock-enable: false # CO-TI: nunca aceitar token de teste
  pay:
    order-notify-url: http://localhost/admin-api/pay/notify/order # 支付渠道的【支付】回调地址
    refund-notify-url: http://localhost/admin-api/pay/notify/refund # 支付渠道的【退款】回调地址
    transfer-notify-url: http://localhost/admin-api/pay/notify/transfer # 支付渠道的【转账】回调地址
  access-log: # 访问日志的配置项
    enable: false
  demo: false # 关闭演示模式
  wxa-code:
    env-version: develop # 小程序版本: 正式版为 "release"；体验版为 "trial"；开发版为 "develop"
  wxa-subscribe-message:
    miniprogram-state: developer # 跳转小程序类型：开发版为 “developer”；体验版为 “trial”为；正式版为 “formal”

justauth:
  enabled: false # CO-TI: login social chinês desligado; o login é pelo AD
  type: {}
  cache:
    type: REDIS
    prefix: 'social_auth_state:' # 缓存前缀，目前只对 Redis 缓存生效，默认 JUSTAUTH::STATE::
    timeout: 24h # 超时时长，目前只对 Redis 缓存生效，默认 3 分钟

--- #################### CO-TI ####################

spring:
  flyway:
    enabled: true
    url: ${CO_TI_DB_URL:jdbc:postgresql://127.0.0.1:5432/coti}
    user: ${CO_TI_DB_USER:coti}
    password: ${CO_TI_DB_PASSWORD}
    locations: classpath:db/migration
    baseline-on-migrate: false

yudao:
  tenant:
    enable: false # CO-TI é single-tenant: uma instalação por empresa, filiais em system_dept/monitor_unit
  websocket:
    sender-type: ${CO_TI_WS_SENDER:local} # use "redis" com mais de uma instância do backend

monitor:
  matrix:
    enabled: ${CO_TI_MATRIX_ENABLED:false}
    homeserver: ${CO_TI_MATRIX_URL:}
    token: ${MATRIX_BOT_TOKEN:}
    sala-alertas: ${CO_TI_MATRIX_SALA_ALERTAS:}
    sala-seguranca: ${CO_TI_MATRIX_SALA_SEGURANCA:}
    nivel-minimo: critico

coti:
  seguranca:
    # Só na primeira partida: substitui a senha pública admin123 do administrador local
    senha-inicial-admin: ${CO_TI_ADMIN_SENHA_INICIAL:}
  ad:
    habilitado: ${CO_TI_AD_HABILITADO:false}
    url: ${CO_TI_AD_URL:}                         # ldaps://dc01.empresa.local:636,ldaps://dc02.empresa.local:636
    bind-dn: ${CO_TI_AD_BIND_DN:}                 # conta de serviço só de leitura
    bind-senha: ${CO_TI_AD_BIND_SENHA:}
    base-usuarios: ${CO_TI_AD_BASE_USUARIOS:}     # OU=Empresa,DC=empresa,DC=local
    filtro-usuarios: ${CO_TI_AD_FILTRO:(&(objectCategory=person)(objectClass=user))}
    ou-raiz: ${CO_TI_AD_OU_RAIZ:}
    dept-raiz-id: ${CO_TI_AD_DEPT_RAIZ_ID:100}
    truststore: ${CO_TI_AD_TRUSTSTORE:}
    truststore-senha: ${CO_TI_AD_TRUSTSTORE_SENHA:}
    cron-sincronizacao: ${CO_TI_AD_CRON:0 */30 * * * *}
    # grupos-perfis:                             # grupo do AD (CN ou DN) → código do perfil no portal
    #   GG-TI-NOC: noc
    #   GG-TI-ServiceDesk: service_desk
