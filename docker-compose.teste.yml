# Serviços só para testes e demonstração (não use em produção):
#   docker compose -f docker-compose.yml -f docker-compose.teste.yml up -d greenmail
# GreenMail: servidor de e-mail falso. SMTP 3025 e IMAP 3143 sem TLS; aceita qualquer usuário e senha.
services:
  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled -Dgreenmail.verbose
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"
    restart: unless-stopped
