# Integração contínua: todo push e pull request no main passam pelos testes do backend e pelo lint, tipos e build do
# frontend. Um vermelho aqui não entra no main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # -fae: mostra a falha de todos os módulos de uma vez, não só do primeiro
      - run: mvn -B -fae test
      - name: Relatórios dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (lint, tipos e build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint ./src
      # o build gera src/types/auto-imports.d.ts (fora do git), que a checagem de tipos usa
      - run: pnpm build:coti
      - run: pnpm exec vue-tsc --noEmit

  imagens:
    name: Imagens Docker
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: coti-frontend-ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Configuração do nginx
        run: |
          docker run --rm --add-host backend:127.0.0.1 -e CO_TI_HTTPS_PORT=443 --entrypoint sh coti-frontend-ci -c \
            '/docker-entrypoint.d/20-envsubst-on-templates.sh && /docker-entrypoint.d/40-certificado.sh && nginx -t'
      - name: Configuração do nginx atrás de proxy (Coolify)
        run: |
          docker run --rm --add-host backend:127.0.0.1 -e CO_TI_ATRAS_DE_PROXY=true --entrypoint sh coti-frontend-ci -c \
            '/docker-entrypoint.d/15-modo-proxy.sh && /docker-entrypoint.d/20-envsubst-on-templates.sh && nginx -t'
      - name: Banco
        uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/Dockerfile.postgres
          push: false
